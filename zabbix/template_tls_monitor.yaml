zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: b60c1784d7fd4d9688c9aca2646a08c2
      name: Templates/Applications
  templates:
    - uuid: a0b02aed734b48cd96022b26fec4bba6
      template: 'TLS Monitor by Zabbix agent active'
      name: 'TLS Monitor by Zabbix agent active'
      description: |
        Monitors TLS certificate expiry for a list of domains via check_certs.py
        (cert.sh-compatible JSON) exposed through Zabbix agent active
        UserParameters. Domains are auto-discovered (LLD); per-domain values are
        derived from a single master item via dependent items + JSONPath.
      groups:
        - name: Templates/Applications
      macros:
        - macro: '{$TLS.CHECK.INTERVAL}'
          value: 5m
          description: 'How often the full cert scan (master item) runs.'
        - macro: '{$TLS.DISCOVERY.INTERVAL}'
          value: 5m
          description: 'How often domains are (re)discovered.'
        - macro: '{$TLS.DAYS.WARN}'
          value: '15'
          description: 'Warn when fewer than this many days remain before expiry.'
        - macro: '{$TLS.DAYS.CRIT}'
          value: '7'
          description: 'High severity when fewer than this many days remain.'
        - macro: '{$TLS.NODATA}'
          value: 15m
          description: 'Alert if the raw report item receives no data for this long.'
      items:
        - uuid: e30c0f08ddcf4b208e33ba0eead08ff6
          name: 'TLS certificates raw report'
          type: ZABBIX_ACTIVE
          key: tls.certs.raw
          delay: '{$TLS.CHECK.INTERVAL}'
          history: 1h
          trends: '0'
          value_type: TEXT
          description: 'Full cert.sh-compatible JSON array for all monitored domains.'
          tags:
            - tag: component
              value: tls
          triggers:
            - uuid: c53c9deaaa834cc6a1fe971ce064ad50
              expression: 'nodata(/TLS Monitor by Zabbix agent active/tls.certs.raw,{$TLS.NODATA})=1'
              name: 'TLS monitor is not sending data'
              priority: HIGH
              description: |
                The raw report item has not received data for {$TLS.NODATA}.
                The agent/pod is likely down or cannot reach the Zabbix server,
                so certificate expiry is NOT being monitored.
              tags:
                - tag: component
                  value: tls
      discovery_rules:
        - uuid: c5a9ac9096af441d93e19e5576fb8638
          name: 'TLS domain discovery'
          type: ZABBIX_ACTIVE
          key: tls.certs.discovery
          delay: '{$TLS.DISCOVERY.INTERVAL}'
          description: 'Discovers monitored domains from check_certs.py --discovery.'
          item_prototypes:
            - uuid: 73a2b443343d4116b348da23e4b55c79
              name: 'Cert status: {#DOMAIN}'
              type: DEPENDENT
              key: 'tls.cert.status[{#DOMAIN}]'
              value_type: TEXT
              description: 'OK | WARNING | ERROR'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.domain=="{#DOMAIN}")].status.first()'
              master_item:
                key: tls.certs.raw
              tags:
                - tag: domain
                  value: '{#DOMAIN}'
            - uuid: ac876e805da149219a0eb99262c9c732
              name: 'Cert days left: {#DOMAIN}'
              type: DEPENDENT
              key: 'tls.cert.days_left[{#DOMAIN}]'
              value_type: FLOAT
              units: days
              description: 'Whole days until expiry (-1 on error).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.domain=="{#DOMAIN}")].days_left.first()'
              master_item:
                key: tls.certs.raw
              tags:
                - tag: domain
                  value: '{#DOMAIN}'
            - uuid: a2a1626d547448088ca85d85e9055d30
              name: 'Cert expires: {#DOMAIN}'
              type: DEPENDENT
              key: 'tls.cert.expires[{#DOMAIN}]'
              value_type: TEXT
              description: 'Expiry timestamp (ISO 8601, empty on error).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.domain=="{#DOMAIN}")].expires.first()'
              master_item:
                key: tls.certs.raw
              tags:
                - tag: domain
                  value: '{#DOMAIN}'
          trigger_prototypes:
            - uuid: c8af88bd5d65459da30623296ccca0f5
              expression: 'last(/TLS Monitor by Zabbix agent active/tls.cert.status[{#DOMAIN}])="ERROR"'
              name: 'TLS check failed for {#DOMAIN}'
              priority: HIGH
              description: 'The certificate check errored (unreachable / no cert / parse failure).'
              tags:
                - tag: domain
                  value: '{#DOMAIN}'
            - uuid: 67dfc5d7e299425ea61a7415ed6c9159
              expression: |
                last(/TLS Monitor by Zabbix agent active/tls.cert.status[{#DOMAIN}])<>"ERROR" and
                last(/TLS Monitor by Zabbix agent active/tls.cert.days_left[{#DOMAIN}])<0
              name: 'TLS certificate EXPIRED for {#DOMAIN}'
              priority: DISASTER
              description: 'The certificate expiry date is in the past (days_left < 0).'
              tags:
                - tag: domain
                  value: '{#DOMAIN}'
            - uuid: 415bf91b7bf643788d019028f1bc5e50
              expression: |
                last(/TLS Monitor by Zabbix agent active/tls.cert.status[{#DOMAIN}])<>"ERROR" and
                last(/TLS Monitor by Zabbix agent active/tls.cert.days_left[{#DOMAIN}])>=0 and
                last(/TLS Monitor by Zabbix agent active/tls.cert.days_left[{#DOMAIN}])<{$TLS.DAYS.CRIT}
              name: 'TLS certificate expires in < {$TLS.DAYS.CRIT} days for {#DOMAIN}'
              priority: HIGH
              description: 'Fewer than {$TLS.DAYS.CRIT} days remain before the certificate expires.'
              dependencies:
                - name: 'TLS certificate EXPIRED for {#DOMAIN}'
                  expression: |
                    last(/TLS Monitor by Zabbix agent active/tls.cert.status[{#DOMAIN}])<>"ERROR" and
                    last(/TLS Monitor by Zabbix agent active/tls.cert.days_left[{#DOMAIN}])<0
              tags:
                - tag: domain
                  value: '{#DOMAIN}'
            - uuid: 65651f5e09fb465dabcc89eaad1d1121
              expression: |
                last(/TLS Monitor by Zabbix agent active/tls.cert.status[{#DOMAIN}])<>"ERROR" and
                last(/TLS Monitor by Zabbix agent active/tls.cert.days_left[{#DOMAIN}])>={$TLS.DAYS.CRIT} and
                last(/TLS Monitor by Zabbix agent active/tls.cert.days_left[{#DOMAIN}])<{$TLS.DAYS.WARN}
              name: 'TLS certificate expires in < {$TLS.DAYS.WARN} days for {#DOMAIN}'
              priority: WARNING
              description: 'Fewer than {$TLS.DAYS.WARN} days remain before the certificate expires.'
              dependencies:
                - name: 'TLS certificate expires in < {$TLS.DAYS.CRIT} days for {#DOMAIN}'
                  expression: |
                    last(/TLS Monitor by Zabbix agent active/tls.cert.status[{#DOMAIN}])<>"ERROR" and
                    last(/TLS Monitor by Zabbix agent active/tls.cert.days_left[{#DOMAIN}])>=0 and
                    last(/TLS Monitor by Zabbix agent active/tls.cert.days_left[{#DOMAIN}])<{$TLS.DAYS.CRIT}
                - name: 'TLS certificate EXPIRED for {#DOMAIN}'
                  expression: |
                    last(/TLS Monitor by Zabbix agent active/tls.cert.status[{#DOMAIN}])<>"ERROR" and
                    last(/TLS Monitor by Zabbix agent active/tls.cert.days_left[{#DOMAIN}])<0
              tags:
                - tag: domain
                  value: '{#DOMAIN}'
