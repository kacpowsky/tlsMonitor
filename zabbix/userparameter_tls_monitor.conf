# tlsMonitor - Zabbix agent 2 UserParameters
#
# Installed into /etc/zabbix/zabbix_agent2.d/tls_monitor.conf by the image.
# The agent runs in active mode and reports these to the Zabbix server.
#
# tls.certs.raw       -> full cert.sh-compatible JSON array (master item)
# tls.certs.discovery -> Zabbix LLD document listing every monitored domain
#
# All per-domain values are derived server-side from tls.certs.raw via
# dependent items + JSONPath, so the agent stays simple and nmap runs once
# per interval instead of once per domain.

UserParameter=tls.certs.raw,/usr/local/bin/check_certs.py
UserParameter=tls.certs.discovery,/usr/local/bin/check_certs.py --discovery
