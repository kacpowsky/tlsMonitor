# tlsMonitor - Zabbix agent 2 UserParameters
#
# Installed into /etc/zabbix/zabbix_agentd.d/tls_monitor.conf by the image.
# (The agent2 image includes zabbix_agentd.d/*.conf; the zabbix_agent2.d dir is
# only scanned for plugins.d/*.conf, so UserParameters must go in agentd.d.)
# The agent runs in active mode and reports these to the Zabbix server.
#
# tls.certs.raw       -> full cert.sh-compatible JSON array (master item)
# tls.certs.discovery -> Zabbix LLD document listing every monitored domain
#
# IMPORTANT: these commands DO NOT run nmap. The slow scanning happens out of
# band (check_certs.py --scan, run periodically by the image) and writes to a
# cache file. Here we only *read* that cache, so the calls return instantly and
# never hit the agent's Timeout ("Timeout occurred while gathering data").
#
# All per-domain values are derived server-side from tls.certs.raw via
# dependent items + JSONPath.

UserParameter=tls.certs.raw,/usr/local/bin/check_certs.py
UserParameter=tls.certs.discovery,/usr/local/bin/check_certs.py --discovery
